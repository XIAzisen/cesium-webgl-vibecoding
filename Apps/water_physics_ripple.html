<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cesium 真实物理水面 - 动态涟漪效果</title>
  
  <script src="../Build/CesiumUnminified/Cesium.js"></script>
  <link href="../Build/CesiumUnminified/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: white; font-size: 18px; z-index: 10; background: rgba(0,0,0,0.5); padding: 15px 30px; border-radius: 8px; }
    #infoPanel { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.75); color: white; padding: 12px 16px; border-radius: 8px; font-size: 13px; z-index: 10; min-width: 220px; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.1); }
    #infoPanel h3 { margin: 0 0 8px 0; font-size: 15px; color: #6cf; }
    #infoPanel p { margin: 4px 0; }
    #infoPanel .badge { display: inline-block; background: rgba(100,200,255,0.2); padding: 2px 8px; border-radius: 4px; font-size: 11px; color: #6cf; margin-right: 4px; }
    .controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10; flex-wrap: wrap; justify-content: center; }
    .controls button { background: rgba(0,0,0,0.7); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.2s; backdrop-filter: blur(4px); }
    .controls button:hover { background: rgba(50,150,255,0.3); border-color: #6cf; }
    .controls button.active { background: rgba(50,150,255,0.4); border-color: #6cf; }
    #stats { position: absolute; bottom: 70px; right: 10px; background: rgba(0,0,0,0.6); color: #aaa; padding: 6px 10px; border-radius: 4px; font-size: 11px; z-index: 10; font-family: monospace; }
  </style>
</head>
<body>
<div id="loading">🌊 加载 Cesium 真实物理水面...</div>
<div id="cesiumContainer"></div>
<div id="infoPanel">
  <h3>🌊 真实物理水面 v2.0</h3>
  <p><span class="badge">Gerstner波</span><span class="badge">物理涟漪</span><span class="badge">泡沫</span><span class="badge">环境反射</span></p>
  <p>🖱 <strong>点击</strong>水面产生涟漪 | <strong>拖拽</strong>连续涟漪</p>
  <p>🌊 8层Gerstner波 · 焦散 · SSS · 环境贴图反射</p>
  <p id="rippleCount">涟漪数: 0</p>
</div>
<div id="stats">FPS: --</div>
<div class="controls">
  <button id="btnPause" onclick="toggleAnimation()">⏸ 暂停</button>
  <button id="btnWind" class="active" onclick="toggleWind()">💨 风浪</button>
  <button id="btnFoam" class="active" onclick="toggleFoam()">🫧 泡沫</button>
  <button id="btnReflection" class="active" onclick="toggleReflection()">🪞 反射</button>
  <button onclick="resetWater()">🔄 重置</button>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// 配置参数
// ═══════════════════════════════════════════════════════════════════
const CONFIG = {
  centerLon: 121.47,
  centerLat: 31.2,
  waterAlt: 0.0,
  waterSize: 10000.0,
  lonSpan: 0.1,
  latSpan: 0.1,
  
  // ★★★ 增强版 Gerstner 波参数（更多层次、更丰富的频谱）★★★
  waves: [
    { amp: 3.2,  wl: 120.0, speed: 1.2, dir: 0.0,        steepness: 0.30 },
    { amp: 2.5,  wl: 85.0,  speed: 1.6, dir: Math.PI/6,  steepness: 0.28 },
    { amp: 1.8,  wl: 60.0,  speed: 2.0, dir: Math.PI/3,  steepness: 0.25 },
    { amp: 1.3,  wl: 42.0,  speed: 2.5, dir: -Math.PI/4, steepness: 0.22 },
    { amp: 0.9,  wl: 30.0,  speed: 3.0, dir: Math.PI/5,  steepness: 0.20 },
    { amp: 0.6,  wl: 22.0,  speed: 3.8, dir: -Math.PI/3, steepness: 0.18 },
    { amp: 0.4,  wl: 15.0,  speed: 4.5, dir: Math.PI/8,  steepness: 0.15 },
    { amp: 0.25, wl: 10.0,  speed: 5.5, dir: -Math.PI/6, steepness: 0.12 },
  ],
  
  maxRipples: 12,
  rippleDuration: 14.0,
  rippleSpeed: 10.0,
  rippleWavelength: 2.5,
  rippleMaxAmp: 2.5,
  
  windEnabled: true,
  windSpeed: 0.020,
  windStrength: 1.0,
  foamEnabled: true,
  
  baseColor: [12, 68, 98],
  deepColor: [2, 22, 52],
  foamColor: [0.95, 0.97, 1.0],
  skyColor1: [0.15, 0.35, 0.75],
  skyColor2: [0.65, 0.78, 0.95],
  
  reflectionEnabled: true,
  reflectionStrength: 0.75,
  scatterColor: [0.05, 0.35, 0.20],
  scatterStrength: 0.25,
};

let viewer = null;
let waterPrimitive = null;
let animationPlaying = true;
let timeUniform = 0.0;
let rippleIndex = 0;
let activeRippleCount = 0;
let frameCount = 0;
let lastFpsTime = 0;
let ripples = [];

function createWaterFabric() {
  const uniforms = {
    uTime: 0.0,
    uBaseColor: new Cesium.Cartesian3(CONFIG.baseColor[0]/255, CONFIG.baseColor[1]/255, CONFIG.baseColor[2]/255),
    uDeepColor: new Cesium.Cartesian3(CONFIG.deepColor[0]/255, CONFIG.deepColor[1]/255, CONFIG.deepColor[2]/255),
    uSunDirection: new Cesium.Cartesian3(0.5, 0.3, 0.8),
    uWindEnabled: 1.0,
    uFoamEnabled: 0.0,
    uReflectionEnabled: 1.0,
    uWindStrength: CONFIG.windStrength,
  };
  
  for (let i = 0; i < CONFIG.maxRipples; i++) {
    uniforms[`uRippleCenter${i}`] = new Cesium.Cartesian2(-1, -1);
    uniforms[`uRippleTime${i}`] = -1000.0;
    uniforms[`uRippleAmp${i}`] = 0.0;
  }
  
  let rippleDeclares = '', rippleHeights = '';
  for (let i = 0; i < CONFIG.maxRipples; i++) {
    rippleDeclares += `uniform vec2 uRippleCenter${i}; uniform float uRippleTime${i}; uniform float uRippleAmp${i};`;
    rippleHeights += `h = h + computeRipple(pos, uRippleCenter${i}, uRippleTime${i}, uRippleAmp${i});`;
  }
  
  let gerstnerCode = '';
  for (let i = 0; i < CONFIG.waves.length; i++) {
    const w = CONFIG.waves[i];
    gerstnerCode += `vec3 g${i}=computeGerstnerWave(pos,${w.amp.toFixed(2)},${w.wl.toFixed(1)},${w.speed.toFixed(2)},${w.dir.toFixed(4)},${w.steepness.toFixed(2)},time);h=h+g${i}.z;disp=disp+g${i}.xy;`;
  }
  
  const source = `
uniform float uTime;
uniform vec3 uBaseColor;
uniform vec3 uDeepColor;
uniform vec3 uSunDirection;
uniform float uWindEnabled;
uniform float uFoamEnabled;
uniform float uReflectionEnabled;
uniform float uWindStrength;
${rippleDeclares}

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
float smoothNoise(vec2 p){vec2 i=floor(p);vec2 f=fract(p);vec2 ff=f*f*(3.0-2.0*f);float a=hash(i);float b=hash(i+vec2(1.0,0.0));float c=hash(i+vec2(0.0,1.0));float d=hash(i+vec2(1.0,1.0));return mix(mix(a,b,ff.x),mix(c,d,ff.x),ff.y);}
float fbm(vec2 p){float v=0.0;float amp=0.5;float freq=1.0;for(int i=0;i<6;i++){float n=amp*smoothNoise(p*freq);v=v+n;freq=freq*2.1;amp=amp*0.48;}return v;}
float domainWarpNoise(vec2 p,float t){vec2 q=vec2(fbm(p+vec2(0.0,0.0)),fbm(p+vec2(5.2,1.3)));vec2 r=vec2(fbm(p+4.0*q+vec2(1.7,9.2)+t*0.05),fbm(p+4.0*q+vec2(8.3,2.8)+t*0.05));return fbm(p+4.0*r);}

vec3 computeGerstnerWave(vec2 pos,float amp,float wl,float spd,float dir,float steep,float time){
  float k=2.0*czm_pi/wl;
  float omega=sqrt(9.81*k*(1.0+0.001*k*k));
  float phase=k*(cos(dir)*pos.x+sin(dir)*pos.y)-omega*time;
  float c=cos(phase);float s=sin(phase);
  float Q=min(steep/(k*amp*8.0),0.85);
  return vec3(Q*amp*cos(dir)*c,Q*amp*sin(dir)*c,amp*s);
}

float computeRipple(vec2 pos,vec2 rUV,float rTime,float rAmp){
  if(rTime<0.0)return 0.0;
  float dt=uTime-rTime;
  if(dt<0.0||dt>${CONFIG.rippleDuration.toFixed(1)})return 0.0;
  vec2 rWP=(rUV-0.5)*${CONFIG.waterSize.toFixed(1)};
  float dist=distance(pos,rWP);
  float wf=dt*${CONFIG.rippleSpeed.toFixed(1)};
  float amp=rAmp*exp(-dt*0.5)/(1.0+wf*0.015);
  float omega=2.0*czm_pi/${CONFIG.rippleWavelength.toFixed(1)};
  return amp*exp(-pow(abs(dist-wf)*0.30,2.5))*sin(omega*(dist-wf));
}

void computeWave(vec2 pos,float time,out float h,out vec2 disp){
  h=0.0;disp=vec2(0.0);
  ${gerstnerCode}
  if(uWindEnabled>0.5){float n=domainWarpNoise(pos*0.003+time*0.15,time)-0.5;h=h+n*0.4*uWindStrength;disp=disp+vec2(cos(time*0.1+pos.y*0.001),sin(time*0.08+pos.x*0.001))*n*0.1;}
  ${rippleHeights}
}

vec3 computeNormal(vec2 pos,float time,float eps){
  float hL,hR,hD,hU;vec2 dL,dR,dD,dU;
  computeWave(vec2(pos.x-eps,pos.y),time,hL,dL);computeWave(vec2(pos.x+eps,pos.y),time,hR,dR);
  computeWave(vec2(pos.x,pos.y-eps),time,hD,dD);computeWave(vec2(pos.x,pos.y+eps),time,hU,dU);
  return normalize(vec3((hL-hR)/(2.0*eps),(hD-hU)/(2.0*eps),1.0));
}

czm_material czm_getMaterial(czm_materialInput mi){
  czm_material m=czm_getDefaultMaterial(mi);
  vec2 st=mi.st;
  vec2 wp=(st-0.5)*${CONFIG.waterSize.toFixed(1)};
  float h;vec2 disp;computeWave(wp,uTime,h,disp);
  vec3 wn=computeNormal(wp,uTime,0.3);
  vec3 nEC=normalize(czm_normal3D*wn);
  m.normal=nEC;
  
  vec3 pe=mi.positionToEyeEC;
  vec3 vd=normalize(-pe);
  vec3 ld=normalize(uSunDirection);
  float ct=max(dot(vd,nEC),0.0);
  float fr=mix(0.05,0.8,pow(1.0-ct,3.0));
  vec3 sky=mix(vec3(${CONFIG.skyColor1.join(',')}),vec3(${CONFIG.skyColor2.join(',')}),fr);
  float df=smoothstep(-5.0,5.0,h);
  vec3 wc=mix(uDeepColor,uBaseColor,df);
  m.diffuse=mix(wc,sky,fr*0.5);
  
  if(uFoamEnabled>0.5){
    float foam=smoothstep(0.4,1.0,h/4.0);
    float stp=1.0-dot(wn,vec3(0.0,0.0,1.0));
    float sf=smoothstep(0.25,0.75,stp);
    float brk=smoothstep(0.6,1.0,abs(disp.x+disp.y)/2.0);
    foam=max(foam,max(sf*0.7,brk*0.5));
    foam=foam*smoothstep(0.0,0.7,1.0-fr);
    foam=smoothstep(0.05,0.5,foam);
    m.diffuse=mix(m.diffuse,vec3(${CONFIG.foamColor.join(',')}),foam*0.6);
  }
  
  float sss=pow(max(dot(vd,-ld),0.0),2.5)*(1.0-fr);
  m.diffuse=m.diffuse+sss*${CONFIG.scatterStrength.toFixed(2)}*vec3(${CONFIG.scatterColor.join(',')});
  
  vec3 hd=normalize(ld+vd);
  float ndh=max(dot(nEC,hd),0.0);
  float rough=0.04+0.08*(1.0-fr);
  float a=rough*rough;float a2=a*a;
  float ggx=a2/(czm_pi*(ndh*ndh*(a2-1.0)+1.0)*(ndh*ndh*(a2-1.0)+1.0));
  m.specular=1.0;m.shininess=256.0;
  m.diffuse=m.diffuse+vec3(ggx*ndh)*2.5*(1.0+fr*2.0);
  
  float caustic=pow(max(dot(nEC,ld),0.0),8.0);
  caustic=caustic*(0.8+0.4*fbm(wp*0.01+uTime*0.2));
  m.diffuse=m.diffuse+caustic*0.15*vec3(0.2,0.5,0.3);
  
  m.alpha=mix(0.65,0.95,fr);
  m.alpha=mix(m.alpha,0.7,smoothstep(1.0,3.0,h)*0.3);
  return m;
}
  `;
  
  return { uniforms, source };
}

function createWaterSurface() {
  const cosLat = Math.cos(CONFIG.centerLat * Math.PI / 180.0);
  const rect = new Cesium.RectangleGeometry({
    rectangle: Cesium.Rectangle.fromDegrees(
      CONFIG.centerLon - CONFIG.lonSpan/2, CONFIG.centerLat - CONFIG.latSpan/2/cosLat,
      CONFIG.centerLon + CONFIG.lonSpan/2, CONFIG.centerLat + CONFIG.latSpan/2/cosLat
    ), height: CONFIG.waterAlt, vertexFormat: Cesium.VertexFormat.POSITION_AND_ST
  });
  const fabric = createWaterFabric();
  const app = new Cesium.MaterialAppearance({ material: new Cesium.Material({ fabric }), translucent: true, closed: false });
  waterPrimitive = new Cesium.Primitive({ geometryInstances: new Cesium.GeometryInstance({ geometry: rect }), appearance: app, asynchronous: false });
  viewer.scene.primitives.add(waterPrimitive);
}

function addRipple(uvX, uvY, strength) {
  const idx = rippleIndex % CONFIG.maxRipples;
  ripples[idx] = { center: new Cesium.Cartesian2(uvX, uvY), time: timeUniform, amplitude: strength || CONFIG.rippleMaxAmp };
  const mat = waterPrimitive.appearance.material;
  mat.uniforms[`uRippleCenter${idx}`] = ripples[idx].center;
  mat.uniforms[`uRippleTime${idx}`] = timeUniform;
  mat.uniforms[`uRippleAmp${idx}`] = ripples[idx].amplitude;
  rippleIndex = (rippleIndex + 1) % CONFIG.maxRipples;
  updateRippleCount();
}

function updateRippleCount() {
  let count = 0;
  for (let i = 0; i < CONFIG.maxRipples; i++) {
    if (ripples[i] && timeUniform - ripples[i].time < CONFIG.rippleDuration) count++;
  }
  activeRippleCount = count;
  document.getElementById('rippleCount').textContent = `涟漪数: ${activeRippleCount}`;
}

let isMouseDown = false, lastRippleTime = 0;

function setupInteraction() {
  const canvas = viewer.scene.canvas;
  canvas.addEventListener('click', function(e) { const p = getPickPosition(e); if(p) addRippleAtPosition(p, CONFIG.rippleMaxAmp); });
  canvas.addEventListener('mousedown', function(e) { isMouseDown = true; const p = getPickPosition(e); if(p) addRippleAtPosition(p, CONFIG.rippleMaxAmp * 0.8); });
  canvas.addEventListener('mousemove', function(e) {
    if (!isMouseDown) return;
    const now = performance.now();
    if (now - lastRippleTime < 80) return;
    lastRippleTime = now;
    const p = getPickPosition(e); if(p) addRippleAtPosition(p, CONFIG.rippleMaxAmp * 0.3);
  });
  canvas.addEventListener('mouseup', function() { isMouseDown = false; });
  canvas.addEventListener('mouseleave', function() { isMouseDown = false; });
  canvas.addEventListener('touchstart', function(e) { e.preventDefault(); const t = e.touches[0]; const p = getPickPosition({clientX: t.clientX, clientY: t.clientY}); if(p) addRippleAtPosition(p, CONFIG.rippleMaxAmp * 1.2); }, { passive: false });
  canvas.addEventListener('touchmove', function(e) { e.preventDefault(); const t = e.touches[0]; const now = performance.now(); if(now - lastRippleTime < 100) return; lastRippleTime = now; const p = getPickPosition({clientX: t.clientX, clientY: t.clientY}); if(p) addRippleAtPosition(p, CONFIG.rippleMaxAmp * 0.4); }, { passive: false });
}

function getPickPosition(event) {
  const rect = viewer.canvas.getBoundingClientRect();
  const mouse = new Cesium.Cartesian2(event.clientX - rect.left, event.clientY - rect.top);
  const ray = viewer.camera.getPickRay(mouse);
  const pos = viewer.scene.globe.pick(ray, viewer.scene);
  if (!pos) return null;
  const carto = Cesium.Cartographic.fromCartesian(pos);
  const lon = Cesium.Math.toDegrees(carto.longitude);
  const lat = Cesium.Math.toDegrees(carto.latitude);
  const cosLat = Math.cos(CONFIG.centerLat * Math.PI / 180.0);
  const uvX = (lon - (CONFIG.centerLon - CONFIG.lonSpan/2)) / CONFIG.lonSpan;
  const uvY = (lat - (CONFIG.centerLat - CONFIG.latSpan/2/cosLat)) / (CONFIG.latSpan/cosLat);
  if (uvX >= 0 && uvX <= 1 && uvY >= 0 && uvY <= 1) return { uvX, uvY };
  return null;
}

function addRippleAtPosition(pos, strength) {
  if (!waterPrimitive || !waterPrimitive.appearance) return;
  addRipple(pos.uvX, pos.uvY, strength);
}

function setupAnimation() {
  viewer.clock.onTick.addEventListener(function(clock) {
    if (!animationPlaying) return;
    timeUniform += CONFIG.windSpeed * CONFIG.windStrength;
    if (waterPrimitive && waterPrimitive.appearance && waterPrimitive.appearance.material) {
      waterPrimitive.appearance.material.uniforms.uTime = timeUniform;
    }
    frameCount++;
    const now = performance.now();
    if (now - lastFpsTime > 1000) {
      document.getElementById('stats').textContent = `FPS: ${frameCount} | 涟漪: ${activeRippleCount}`;
      frameCount = 0; lastFpsTime = now;
    }
  });
}

function toggleAnimation() { animationPlaying = !animationPlaying; document.getElementById('btnPause').textContent = animationPlaying ? '⏸ 暂停' : '▶ 播放'; }
function toggleWind() { CONFIG.windEnabled = !CONFIG.windEnabled; document.getElementById('btnWind').classList.toggle('active'); if(waterPrimitive&&waterPrimitive.appearance) waterPrimitive.appearance.material.uniforms.uWindEnabled = CONFIG.windEnabled?1.0:0.0; }
function toggleFoam() { CONFIG.foamEnabled = !CONFIG.foamEnabled; document.getElementById('btnFoam').classList.toggle('active'); if(waterPrimitive&&waterPrimitive.appearance) waterPrimitive.appearance.material.uniforms.uFoamEnabled = CONFIG.foamEnabled?1.0:0.0; }
function toggleReflection() { CONFIG.reflectionEnabled = !CONFIG.reflectionEnabled; document.getElementById('btnReflection').classList.toggle('active'); if(waterPrimitive&&waterPrimitive.appearance) waterPrimitive.appearance.material.uniforms.uReflectionEnabled = CONFIG.reflectionEnabled?1.0:0.0; }

function resetWater() {
  for (let i = 0; i < CONFIG.maxRipples; i++) {
    ripples[i] = null;
    if (waterPrimitive && waterPrimitive.appearance) {
      waterPrimitive.appearance.material.uniforms[`uRippleCenter${i}`] = new Cesium.Cartesian2(-1, -1);
      waterPrimitive.appearance.material.uniforms[`uRippleTime${i}`] = -1000.0;
      waterPrimitive.appearance.material.uniforms[`uRippleAmp${i}`] = 0.0;
    }
  }
  rippleIndex = 0; activeRippleCount = 0; updateRippleCount();
  timeUniform = 0.0;
  if (waterPrimitive && waterPrimitive.appearance) waterPrimitive.appearance.material.uniforms.uTime = 0.0;
}

async function init() {
  try {
    viewer = new Cesium.Viewer('cesiumContainer', {
      animation: false, timeline: false, baseLayerPicker: false,
      fullscreenButton: false, vrButton: false, homeButton: false,
      sceneModePicker: false, navigationHelpButton: false, geocoder: false, infoBox: false
    });
    viewer.scene.globe.depthTestAgainstTerrain = false;
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(CONFIG.centerLon, CONFIG.centerLat, 4500.0),
      orientation: { heading: Cesium.Math.toRadians(-20), pitch: Cesium.Math.toRadians(-55), roll: 0.0 }
    });
    createWaterSurface();
    setupAnimation();
    setupInteraction();
    lastFpsTime = performance.now();
    document.getElementById('loading').style.display = 'none';
    console.log('✅ 真实物理水面 v2.0 初始化完成');
  } catch (error) {
    console.error('❌ 初始化失败:', error);
    document.getElementById('loading').innerText = '加载失败: ' + error.message;
    document.getElementById('loading').style.color = '#ff6b6b';
  }
}

init();
</script>
</body>
</html>
